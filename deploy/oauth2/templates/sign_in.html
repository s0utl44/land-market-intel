<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Logowanie · Radar Działek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
:root{--bg:#f7f6f3;--surface:#fff;--ink:#1a1a1a;--ink-2:#4d4a44;--muted:#7d786e;--line:#e7e3da;--gold:#d2a436;--gold-ink:#8a6610;--bad:#b0352f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1b1b1a;--ink:#f1efe9;--ink-2:#c4bfb4;--muted:#8f8a80;--line:#2c2b28;--gold:#d9ad45;--gold-ink:#e2bb5c;--bad:#f08f88;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Lato","Segoe UI",system-ui,-apple-system,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 30px rgb(0 0 0 / .06)}
.logo{height:38px;width:auto;color:var(--ink)}
h1{margin:0;font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
h1 span{color:var(--gold-ink)}
p{margin:0;color:var(--ink-2);line-height:1.5}
.google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.google:hover{border-color:var(--gold)}
.google:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-weight:700}
a{color:var(--gold-ink);font-weight:700}
