# Strona startowa domeny (https://LMI_DOMAIN/): kafelki DoneHome (Radar działek) i WRE Nieruchomości (Generator umów).
# Statyczny plik portal/site/index.html, za tym samym logowaniem Google co podstrony.
# Dokładane w COMPOSE_FILE razem z docker-compose.subpath.yml (radar pod /radar, katalog główny wolny).
services:
  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./portal/site:/usr/share/nginx/html:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.lmi-portal.rule=Host(`${LMI_DOMAIN}`) && (Path(`/`) || Path(`/index.html`) || PathPrefix(`/wspolne/`))
      - traefik.http.routers.lmi-portal.entrypoints=websecure
      - traefik.http.routers.lmi-portal.tls.certresolver=letsencrypt
      - traefik.http.routers.lmi-portal.middlewares=${LMI_AUTH_MIDDLEWARE:-lmi-google}${LMI_UPRAWNIENIA-,wre-portal},lmi-headers
      - traefik.http.routers.lmi-portal.service=lmi-portal
      - traefik.http.services.lmi-portal.loadbalancer.server.port=80
