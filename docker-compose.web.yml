# Publikacja pod domeną przez istniejący na serwerze Traefik (HTTPS + hasło na wejściu).
#   https://LMI_DOMAIN/          -> strona Radar Działek (usługa web)
#   https://LMI_DOMAIN/metabase  -> Metabase (własne analizy)
# Włączane przez COMPOSE_FILE w .env: COMPOSE_FILE=docker-compose.yml:docker-compose.web.yml
# Wymagane w .env: LMI_DOMAIN, LMI_BASIC_AUTH (login:skrót z `openssl passwd -apr1`, w pojedynczych
# cudzysłowach; kilka osób oddziela się przecinkiem).
services:
  web:
    labels:
      - traefik.enable=true
      - traefik.http.routers.lmi.rule=Host(`${LMI_DOMAIN:?ustaw LMI_DOMAIN w .env}`)
      - traefik.http.routers.lmi.entrypoints=websecure
      - traefik.http.routers.lmi.tls.certresolver=letsencrypt
      - traefik.http.routers.lmi.middlewares=lmi-czysc,lmi-auth,lmi-limit,lmi-headers,lmi-csp
      - traefik.http.routers.lmi.service=lmi-web
      - traefik.http.services.lmi-web.loadbalancer.server.port=8080
      - traefik.http.middlewares.lmi-auth.basicauth.users=${LMI_BASIC_AUTH:?ustaw LMI_BASIC_AUTH w .env}
      # login z bramki trafia do aplikacji (ulubione i komentarze na osobę); Traefik nadpisuje ten nagłówek
      - traefik.http.middlewares.lmi-auth.basicauth.headerField=X-Auth-Request-User
      # lmi-czysc – PIERWSZY w każdym routerze (audyt 25.10): usuwa nagłówki uprawnień przysłane przez przeglądarkę.
      # Ustawia je dopiero forwardAuth wre-<obszar>; bez tego router bez wre-* (tryb awaryjny Odprawy, LMI_UPRAWNIENIA=)
      # przepuściłby podrobione „X-Pracawre-Poziom: admin”. Pusta wartość = usunięcie nagłówka.
      - traefik.http.middlewares.lmi-czysc.headers.customRequestHeaders.X-Pracawre-Poziom=
      - traefik.http.middlewares.lmi-czysc.headers.customRequestHeaders.X-Pracawre-Rola=
      - traefik.http.middlewares.lmi-czysc.headers.customRequestHeaders.X-Auth-Request-Email=
      - traefik.http.middlewares.lmi-czysc.headers.customRequestHeaders.X-Auth-Request-User=
      - traefik.http.middlewares.lmi-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.lmi-headers.headers.frameDeny=true
      - traefik.http.middlewares.lmi-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.lmi-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.lmi-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.lmi-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.lmi-headers.headers.permissionsPolicy=camera=(self), microphone=(), geolocation=(), payment=(), usb=()
      # druga linia obrony przed wstrzykniętym kodem (pełna CSP wymaga przeniesienia skryptów inline – w planie)
      - traefik.http.middlewares.lmi-headers.headers.contentSecurityPolicy=base-uri 'self'; object-src 'none'; frame-ancestors 'self'
      # lmi-csp – pełna polityka dla aplikacji WRE (audyt 25.10, etap 1): skrypty, połączenia i ramki tylko z pracawre.com,
      # czcionki Google, obrazki także z portali (miniatury w Leadach). Na razie TYLKO ZGŁASZA (Report-Only → Kartoteka
      # /csp-raport, docker logs … | grep CSP); po kilku dniach bez zgłoszeń: zmienić nazwę nagłówka na Content-Security-Policy.
      # Etap 2: bez 'unsafe-inline' w script-src (odciski skryptów z budowania). Metabase ma własną CSP – bez lmi-csp.
      - "traefik.http.middlewares.lmi-csp.headers.customResponseHeaders.Content-Security-Policy-Report-Only=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; report-uri /csp-raport"
      # lmi-limit – największe zapytanie do aplikacji (audyt 25.10): Traefik odrzuca większe (413), zanim dotrą do aplikacji.
      # Stoi PO logowaniu (lmi-google, wre-*), więc obcy nie wyśle nawet bajtu treści. 10 MB = zrzut ekranu w „Zgłoś błąd”.
      # Większe limity mają Generator (umowy-limit) i Protokoły (protokoly-limit) – zdefiniowane w ich repozytoriach.
      - traefik.http.middlewares.lmi-limit.buffering.maxRequestBodyBytes=10485760

  metabase:
    environment:
      MB_SITE_URL: https://${LMI_DOMAIN}/metabase
    labels:
      - traefik.enable=true
      - traefik.http.routers.lmi-mb.rule=Host(`${LMI_DOMAIN}`) && PathPrefix(`/metabase`)
      - traefik.http.routers.lmi-mb.entrypoints=websecure
      - traefik.http.routers.lmi-mb.tls.certresolver=letsencrypt
      # lmi-auth i lmi-headers są zdefiniowane na usłudze web
      - traefik.http.routers.lmi-mb.middlewares=lmi-czysc,lmi-auth,lmi-headers,lmi-mb-slash,lmi-mb-strip
      - traefik.http.routers.lmi-mb.service=lmi-mb
      - traefik.http.services.lmi-mb.loadbalancer.server.port=3000
      # /metabase -> /metabase/ (bez ukośnika Metabase gubi ścieżki zasobów)
      - traefik.http.middlewares.lmi-mb-slash.redirectregex.regex=^(https?://[^/]+/metabase)$$
      - traefik.http.middlewares.lmi-mb-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.lmi-mb-strip.stripprefix.prefixes=/metabase
