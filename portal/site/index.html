<title>WRE Nieruchomości · pracawre.com</title>

<style>
/* Strona główna pracawre.com = pulpit WRE Nieruchomości (decyzja użytkownika 25.10): tylko WRE (DoneHome to osobny
   projekt), kafelki tylko tych narzędzi, do których osoba ma dostęp (panel Administracja), w grupach.
   Wygląd jak Generator umów: złoto #c9a03c / #9b7a26, krem #f3f1ec, Lato, logo z lwem. */
:root{
  --bg:#f3f1ec; --karta:#ffffff; --tekst:#1f1d1a; --szary:#6b665d; --linia:#e2ddd2; --zloto:#c9a03c; --zloto-c:#9b7a26; --hover:#f7f3e8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181a; --karta:#222427; --tekst:#e6e3dc; --szary:#9a958b; --linia:#3a3c40; --zloto-c:#d9b55a; --hover:#2a2b2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181a; --karta:#222427; --tekst:#e6e3dc; --szary:#9a958b; --linia:#3a3c40; --zloto-c:#d9b55a; --hover:#2a2b2e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--tekst);
  font-family:"Lato","Segoe UI",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--zloto);outline-offset:3px}
[hidden]{display:none!important}
.pulpit{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:clamp(24px,5vw,56px) 16px 40px;display:flex;flex-direction:column;gap:36px}

.glowa{display:flex;align-items:center;gap:clamp(18px,4vw,40px);flex-wrap:wrap}
.logo{width:min(240px,60vw);height:auto;display:block}
.logo.ciemne{display:none}
:root[data-theme="dark"] .logo.jasne{display:none}:root[data-theme="dark"] .logo.ciemne{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.jasne{display:none}:root:not([data-theme="light"]) .logo.ciemne{display:block}}
.powitanie{border-left:2px solid var(--zloto);padding-left:clamp(18px,4vw,40px)}
.powitanie h1{margin:0;font-weight:300;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.2}
.powitanie h1 em{font-family:"Lora",Georgia,serif;font-weight:500;color:var(--zloto-c)}
.powitanie p{margin:6px 0 0;color:var(--szary)}

/* 28.10 (decyzja użytkownika): narzędzia tylko w menu ☰ w pasku – pulpit pokazuje rzeczy ważne: „Do zrobienia” (liczby
   z aplikacji, kafelek tylko gdy jest coś do zrobienia) i „Moje zadania” z HubSpot. Miejsce na kolejne (np. faktury z ClickUp). */
.kafle.do{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grupa h2{margin:0 0 14px;font-size:.72rem;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--zloto-c)}
.kafle{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.kafel{height:100%;display:flex;gap:16px;align-items:center;padding:20px;border-radius:14px;text-decoration:none;color:inherit;
  background:var(--karta);border:1px solid var(--linia);box-shadow:0 1px 3px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.05);
  transition:transform .15s,border-color .15s,background .15s}
.kafel:hover{transform:translateY(-1px);border-color:var(--zloto);background:var(--hover)}
.kafel .ik{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--zloto);color:#fff}
.kafel .ik svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kafel b{display:block;font-size:1.08rem}
.kafel small{display:block;margin-top:3px;font-size:.88rem;line-height:1.45;color:var(--szary)}
.kafel .dalej{margin-left:auto;font-size:1.2rem;color:var(--zloto-c);transition:transform .15s}
.kafel:hover .dalej{transform:translateX(3px)}
.liczby{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.liczby:empty{display:none}
.liczba{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--hover);border:1px solid var(--linia);color:var(--tekst)}
.liczba.wazne{background:var(--zloto);border-color:var(--zloto);color:#1f1d1a}

/* moje zadania z HubSpot (Leady → /leady/api/zadania): zaległe, dziś, najbliższy tydzień */
/* 28.10 (decyzja użytkownika): widać ok. 5 zadań, resztę przewija się w ramce – pulpit nie jest nimi zasypany */
.zadania{list-style:none;margin:0;padding:0;background:var(--karta);border:1px solid var(--linia);border-radius:14px;overflow:auto;max-height:330px;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.05)}
.zadanie{display:flex;gap:14px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--linia)}
.zadanie:first-child{border-top:0}
.zadanie .ik{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--zloto-c)}
.zadanie .ik svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zadanie .tx{min-width:0;flex:1}
.zadanie b{display:block;font-size:.98rem}
.zadanie .gdzie{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:.84rem}
.zadanie .gdzie a{color:var(--zloto-c);text-decoration:none;font-weight:700}.zadanie .gdzie a:hover{text-decoration:underline}
.zadanie .kiedy{flex:none;font-size:.82rem;font-weight:700;color:var(--szary);white-space:nowrap;padding-top:2px}
.zadanie.zalegle .kiedy{color:#b3261e}
:root[data-theme="dark"] .zadanie.zalegle .kiedy{color:#f08f88}
.zadanie .pilne{font-size:.66rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#b3261e;margin-left:6px}
.zadania-info{margin:10px 0 0;font-size:.84rem;color:var(--szary)}
.pusto{padding:28px;border:1px dashed var(--linia);border-radius:14px;color:var(--szary);text-align:center}
.stopka{margin-top:auto;font-size:.78rem;color:var(--szary)}
@media (max-width:640px){.powitanie{border-left:0;padding-left:0}}
</style>

<script>
"use strict";
// „Do zrobienia”: kafelek aplikacji tylko wtedy, gdy podała coś do zrobienia (liczby); nazwy i ikony z /wspolne/pasek.js.
// Administracja (nowe zgłoszenia) – tylko dla administratorów.
const ADMINISTRACJA = {obszar: 'administracja', href: '/administracja/#zgloszenia', nazwa: 'Administracja',
  ikona: '<path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>'};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DOSTEPNE = [];
const DO = {}; // obszar → [[liczba, tekst, ważne]]
function rysujDo(){
  const kafle = DOSTEPNE.filter(a => (DO[a.obszar] || []).length).map(a =>
    `<li><a class="kafel" href="${a.href}"><span class="ik" aria-hidden="true"><svg viewBox="0 0 24 24">${a.ikona}</svg></span>
      <span><b>${esc(a.nazwa)}</b><span class="liczby">${DO[a.obszar].map(([n, tekst, wazne]) => `<span class="liczba${wazne ? ' wazne' : ''}">${esc(tekst)}</span>`).join('')}</span></span>
      <span class="dalej" aria-hidden="true">→</span></a></li>`).join('');
  document.getElementById('doLista').innerHTML = kafle;
  document.getElementById('doZrobienia').hidden = !kafle;
}

function powitaj(k){
  const imie = k && k.nazwa ? k.nazwa.split(/\s+/)[0] : '';
  const godz = new Date().getHours();
  const zwrot = godz < 5 || godz >= 18 ? 'Dobry wieczór' : 'Dzień dobry';
  document.getElementById('powitanie').innerHTML = imie ? `${zwrot}, <em>${esc(imie)}</em>` : zwrot;
  document.getElementById('dzis').textContent = new Date().toLocaleDateString('pl-PL', {weekday:'long', day:'numeric', month:'long'});
}

// --- liczby na kafelkach (25.10, decyzja użytkownika): co jest do zrobienia, bez wchodzenia w narzędzie ---------------
// Każda aplikacja podaje swoje liczby; błąd albo brak odpowiedzi = kafelek bez liczb (pulpit działa dalej).
const odm = (n, jedna, kilka, wiele) => `${n} ${n === 1 ? jedna : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? kilka : wiele}`;
function liczby(obszar, lista){ DO[obszar] = lista.filter(([n]) => n > 0); rysujDo(); }
async function pobierz(url, opcje){
  const r = await fetch(url, {credentials:'same-origin', ...opcje});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function liczbyLeadow(){
  pobierz('/leady/api/pulpit').then(d => {
    liczby('leady', [[d.do_wziecia, odm(d.do_wziecia, 'lead', 'leady', 'leadów')],
      [d.moje.nowy, odm(d.moje.nowy, 'nowy u mnie', 'nowe u mnie', 'nowych u mnie'), true],
      [d.moje.ponownie, `${d.moje.ponownie} do ponownego telefonu`, true],
      [d.moje.zakwal, odm(d.moje.zakwal, 'zakwalifikowany', 'zakwalifikowane', 'zakwalifikowanych')]]);
  }).catch(() => {});
  // zadania osobno: liczby na kafelku nie czekają na HubSpot
  pobierz('/leady/api/zadania').then(zadania).catch(() => {});
}
function liczbyUmow(){
  pobierz('/umowy/api/szkiceLista', {method:'POST', headers:{'Content-Type':'application/json'}, body:'[]'}).then(d => {
    const n = (d.wynik || []).length;
    liczby('umowy', [[n, odm(n, 'niezapisana umowa', 'niezapisane umowy', 'niezapisanych umów'), true]]);
  }).catch(() => {});
}

// --- moje zadania z HubSpot: zaległe, dziś i najbliższy tydzień; każde z linkiem do kontaktu / transakcji -----------
const IKONY_ZADAN = {
  CALL: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  EMAIL: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
  TODO: '<path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/>',
};
const DZIEN = 864e5;
const poczatekDnia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
function kiedy(termin){
  const t = new Date(termin), dni = Math.round((poczatekDnia(t) - poczatekDnia(new Date())) / DZIEN);
  const godz = t.getHours() || t.getMinutes() ? ' ' + t.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'}) : '';
  if (dni === 0) return 'dziś' + godz;
  if (dni === 1) return 'jutro' + godz;
  if (dni < 0) return 'zaległe · ' + (dni === -1 ? 'wczoraj' : t.toLocaleDateString('pl-PL', {day:'numeric', month:'short'}));
  return t.toLocaleDateString('pl-PL', {weekday:'short', day:'numeric', month:'short'});
}
const linkHubSpot = u => /^https:\/\/app\.hubspot\.com\//.test(u || '') ? u : '';
function zadania(z){
  const sekcja = document.getElementById('naDzis'), info = document.getElementById('zadaniaInfo');
  sekcja.hidden = false;
  const granica = poczatekDnia(new Date()) + 8 * DZIEN;       // do końca 7. dnia od dziś
  const blisko = z.lista.filter(x => !x.termin || new Date(x.termin).getTime() < granica);
  const pozniej = z.lista.length - blisko.length;
  document.getElementById('zadania').innerHTML = blisko.map(x => {
    const zalegle = x.termin && poczatekDnia(new Date(x.termin)) < poczatekDnia(new Date());
    const gdzie = x.gdzie.map(g => {
      const nazwa = esc(g.nazwa || (g.typ === 'kontakt' ? 'kontakt' : 'transakcja')), link = linkHubSpot(g.link);
      return link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${nazwa}</a>` : `<span>${nazwa}</span>`;
    }).join('');
    return `<li class="zadanie${zalegle ? ' zalegle' : ''}"><span class="ik" aria-hidden="true"><svg viewBox="0 0 24 24">${IKONY_ZADAN[x.typ] || IKONY_ZADAN.TODO}</svg></span>
      <span class="tx"><b>${esc(x.tytul)}${x.pilne ? '<span class="pilne">pilne</span>' : ''}</b>${gdzie ? `<span class="gdzie">${gdzie}</span>` : ''}</span>
      <span class="kiedy">${x.termin ? esc(kiedy(x.termin)) : 'bez terminu'}</span></li>`;
  }).join('') || `<li class="zadanie"><span class="tx">${z.blad ? esc('Nie udało się pobrać zadań: ' + z.blad) : 'Nic zaległego ani zaplanowanego na najbliższy tydzień.'}</span></li>`;
  document.getElementById('zadaniaN').textContent = blisko.length > 5 ? `· ${blisko.length}` : '';
  info.hidden = !pozniej;
  info.textContent = pozniej ? `Później: ${odm(pozniej, 'zadanie', 'zadania', 'zadań')} – w HubSpot.` : '';
}

PracawrePasek.konto().then(k => {
  powitaj(k);
  const agent = PracawrePasek.widokAgenta && PracawrePasek.widokAgenta();   // widok agenta – bez Administracji
  DOSTEPNE = [...PracawrePasek.aplikacje(k), ...(k && k.admin && !agent ? [ADMINISTRACJA] : [])];
  document.getElementById('brakDostepu').hidden = !!DOSTEPNE.length;
  window.addEventListener('pracawre-widok-agenta', () => location.reload());
  const ma = obszar => PracawrePasek.aplikacje(k).some(a => a.obszar === obszar);
  if (ma('leady')) liczbyLeadow();
  if (ma('umowy')) liczbyUmow();
  if (k && k.admin && !agent && k.zgloszeniaNowe) liczby('administracja', [[k.zgloszeniaNowe, odm(k.zgloszeniaNowe, 'nowe zgłoszenie', 'nowe zgłoszenia', 'nowych zgłoszeń'), true]]);
});
</script>
