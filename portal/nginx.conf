# Strona startowa: bez zapamiętywania w przeglądarce. Inaczej po „Wyloguj” przeglądarka pokazuje stronę z pamięci
# zamiast zapytać serwer (i dostać ekran logowania).
server {
    listen 80;
    root /usr/share/nginx/html;
    # wspólny pasek wszystkich podstron (motyw, nawigacja, kafelki pulpitu): przeglądarka pyta za każdym razem
    # (niezmieniony = krótkie 304). Dawne max-age=300 dawało po wdrożeniu nową stronę główną ze starym paskiem – pusty pulpit.
    location /wspolne/ {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
