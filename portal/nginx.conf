# Strona startowa: bez zapamiętywania w przeglądarce. Inaczej po „Wyloguj” przeglądarka pokazuje stronę z pamięci
# zamiast zapytać serwer (i dostać ekran logowania).
server {
    listen 80;
    root /usr/share/nginx/html;
    # wspólny pasek wszystkich podstron (motyw, nawigacja): krótka pamięć przeglądarki
    location /wspolne/ {
        add_header Cache-Control "public, max-age=300" always;
    }
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
