[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "land-market-intel"
version = "0.1.0"
description = "PoC: wykrywanie rynków gruntów o wysokim potencjale"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lmi = "lmi.cli:main"
lmi-web = "lmi.web:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lmi = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: wymaga PostgreSQL+PostGIS (LMI_TEST_DATABASE_URL)"]
