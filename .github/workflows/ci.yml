name: testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lmi
          POSTGRES_PASSWORD: lmi
          POSTGRES_DB: lmi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lmi -d lmi"
          --health-interval 5s
          --health-retries 20
    env:
      LMI_TEST_DATABASE_URL: postgresql://lmi:lmi@localhost:5432/lmi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
