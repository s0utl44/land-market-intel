services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lmi
      POSTGRES_USER: lmi
      POSTGRES_PASSWORD: ${LMI_DB_PASSWORD:-lmi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # tylko lokalnie; nie wystawiać bazy do internetu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmi -d lmi"]
      interval: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.50.36
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mbdata:/metabase-data
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  mbdata:
