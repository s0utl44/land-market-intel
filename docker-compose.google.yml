# Logowanie kontem Google (tylko adresy z domeny firmy) zamiast hasła w okienku przeglądarki.
# Włączane przez COMPOSE_FILE w .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.web.yml:docker-compose.google.yml
# Wymagane w .env: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, OAUTH2_COOKIE_SECRET (instrukcja: deploy/README.md).
# Zakłada Traefika w trybie sieci host (jak na serwerze): forwardAuth idzie na 127.0.0.1:4180.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:?ustaw GOOGLE_CLIENT_ID w .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?ustaw GOOGLE_CLIENT_SECRET w .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?ustaw OAUTH2_COOKIE_SECRET w .env}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${LMI_EMAIL_DOMAIN:?ustaw LMI_EMAIL_DOMAIN w .env (domena firmowej poczty)}
      OAUTH2_PROXY_REDIRECT_URL: https://${LMI_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${LMI_DOMAIN}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # tryb forwardAuth: oauth2-proxy tylko sprawdza sesję (202) albo pokazuje stronę logowania
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_NAME: _radar_auth
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # jawne Lax (audyt 25.10): bez atrybutu Chrome przez 2 min po każdym odświeżeniu ciasteczka (co godzinę) wysyła je
      # także z formularza POST innej strony – okno na CSRF w przyciskach bez treści zapytania (np. „Biorę” w Leadach)
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 72h        # 3 dni (decyzja 22.10)
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: /templates
      OAUTH2_PROXY_FOOTER: "-"
    volumes:
      - ./deploy/oauth2/templates:/templates:ro
    ports:
      - "127.0.0.1:4180:4180"
    labels:
      - traefik.enable=true
      # ścieżki logowania (/oauth2/start, /oauth2/callback, /oauth2/sign_out) idą prosto do oauth2-proxy
      - traefik.http.routers.lmi-oauth.rule=Host(`${LMI_DOMAIN}`) && PathPrefix(`/oauth2`)
      - traefik.http.routers.lmi-oauth.entrypoints=websecure
      - traefik.http.routers.lmi-oauth.tls.certresolver=letsencrypt
      - traefik.http.routers.lmi-oauth.service=lmi-oauth
      - traefik.http.services.lmi-oauth.loadbalancer.server.port=4180
      - traefik.http.middlewares.lmi-google.forwardauth.address=http://127.0.0.1:4180/
      - traefik.http.middlewares.lmi-google.forwardauth.maxResponseBodySize=1048576
      - traefik.http.middlewares.lmi-google.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.lmi-google.forwardauth.authResponseHeaders=X-Auth-Request-Email,X-Auth-Request-User
      # maxResponseBodySize (ostrzeżenie Traefika 25.10): odpowiedź sprawdzania najwyżej 1 MB (strona logowania ~135 KB, „Brak dostępu” ~2 KB);
      # wre-*: trustForwardHeader=false – Kartoteka nie czyta X-Forwarded-*, więc nie przekazujemy ich z przeglądarki.
      # lmi-google zostaje przy true: oauth2-proxy buduje z nich adres powrotu po zalogowaniu.
      # uprawnienia całej witryny (panel Administracja w usłudze kartoteki, 127.0.0.1:8098): po logowaniu Google
      # Traefik pyta, czy konto ma dostęp do obszaru – 403 „Brak dostępu” albo nagłówek X-Pracawre-Poziom (dostep | admin)
      - traefik.http.middlewares.wre-portal.forwardauth.address=http://127.0.0.1:8098/sprawdz/portal
      - traefik.http.middlewares.wre-portal.forwardauth.maxResponseBodySize=1048576
      - traefik.http.middlewares.wre-portal.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.wre-portal.forwardauth.authResponseHeaders=X-Pracawre-Poziom,X-Pracawre-Rola
      - traefik.http.middlewares.wre-umowy.forwardauth.address=http://127.0.0.1:8098/sprawdz/umowy
      - traefik.http.middlewares.wre-umowy.forwardauth.maxResponseBodySize=1048576
      - traefik.http.middlewares.wre-umowy.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.wre-umowy.forwardauth.authResponseHeaders=X-Pracawre-Poziom,X-Pracawre-Rola
      - traefik.http.middlewares.wre-protokoly.forwardauth.address=http://127.0.0.1:8098/sprawdz/protokoly
      - traefik.http.middlewares.wre-protokoly.forwardauth.maxResponseBodySize=1048576
      - traefik.http.middlewares.wre-protokoly.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.wre-protokoly.forwardauth.authResponseHeaders=X-Pracawre-Poziom,X-Pracawre-Rola
      - traefik.http.middlewares.wre-kartoteka.forwardauth.address=http://127.0.0.1:8098/sprawdz/kartoteka
      - traefik.http.middlewares.wre-kartoteka.forwardauth.maxResponseBodySize=1048576
      - traefik.http.middlewares.wre-kartoteka.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.wre-kartoteka.forwardauth.authResponseHeaders=X-Pracawre-Poziom,X-Pracawre-Rola
      - traefik.http.middlewares.wre-radar.forwardauth.address=http://127.0.0.1:8098/sprawdz/radar
      - traefik.http.middlewares.wre-radar.forwardauth.maxResponseBodySize=1048576
      - traefik.http.middlewares.wre-radar.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.wre-radar.forwardauth.authResponseHeaders=X-Pracawre-Poziom,X-Pracawre-Rola

  web:
    labels:
      - traefik.http.routers.lmi.middlewares=lmi-czysc,lmi-google,lmi-limit,lmi-headers,lmi-csp

  metabase:
    labels:
      - traefik.http.routers.lmi-mb.middlewares=lmi-czysc,lmi-google,lmi-headers,lmi-mb-slash,lmi-mb-strip
